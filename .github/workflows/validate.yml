name: Validate EMPIRA package

on:
  push:
    branches:
      - main
      - "release-*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate package integrity
        run: node scripts/validate-package.mjs
